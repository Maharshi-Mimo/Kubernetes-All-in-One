apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-deployment-configmap-role
  namespace: tet
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maharshi-developer-binding
  namespace: tet
subjects:
  - kind: User
    name: Maharshi
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-deployment-configmap-role
  apiGroup: rbac.authorization.k8s.io
